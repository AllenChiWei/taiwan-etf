name: 每日更新 ETF 資料

# 台灣時間每個交易日 19:00（= UTC 11:00）。台股 13:30 收盤，MoneyDJ 傍晚才更新完報酬率。
# 要改時間就改下面的 cron：GitHub 用 UTC，台灣時間減 8 小時。
# 例：台灣 21:00 -> '0 13 * * 1-5'；台灣 08:00 -> '0 0 * * 2-6'（跨日，星期往後移一天）
on:
  schedule:
    - cron: '0 11 * * 1-5'
  workflow_dispatch:
    inputs:
      skip_returns:
        description: '略過報酬率計算（只更新名單／保管銀行／配息）'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FINLAB_API_TOKEN: ${{ secrets.FINLAB_API_TOKEN }}
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: 安裝相依套件
        run: |
          # 鎖版本，理由同 deploy.yml：這個 job 也帶著 FINLAB_API_TOKEN。
          pip install --quiet certifi==2026.7.22 finlab==2.0.19
          cd app && npm ci

      # 報酬率自 2026-09 起只由 FinLab 計算，沒有憑證就算不出來。
      # 早點失敗：先前沒擋的時候，流程會先爬完 359 頁 MoneyDJ、產生一份報酬率
      # 全是 N/A 的資料，最後才被驗證器擋下 —— 白跑十分鐘，也白打擾了資料來源。
      - name: 檢查必要憑證
        run: |
          if [ -z "$FINLAB_API_TOKEN" ]; then
            echo "::error title=缺少 FINLAB_API_TOKEN::報酬率由 FinLab 計算，沒有這個 secret 就無法更新。"
            echo "::error::到 Settings → Secrets and variables → Actions 建立名為 FINLAB_API_TOKEN 的 secret。"
            echo "::error::注意：本機的 .env 不會上傳（被 gitignore 擋住），CI 看不到它。"
            exit 1
          fi
          echo "FinLab 憑證已設定（長度 ${#FINLAB_API_TOKEN}）"

      - name: 連線檢查
        # 先確認資料來源從 GitHub 的機器連得到。連不到就直接失敗，
        # 不要讓爬蟲跑 20 分鐘才發現拿到一堆錯誤頁。
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' -m 30 \
            -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/122.0 Safari/537.36' \
            'https://www.moneydj.com/ETF/X/Basic/Basic0004.xdjhtm?etfid=0050.tw' || echo 000)
          echo "MoneyDJ: HTTP $code"
          [ "$code" = "200" ] || { echo "::error::MoneyDJ 無法連線，中止更新（既有資料保持不變）"; exit 1; }

      - name: 建立工作目錄並保留前一版
        run: |
          echo "WORK=${RUNNER_TEMP}/etf" >> $GITHUB_ENV
          mkdir -p "${RUNNER_TEMP}/etf"
          cp app/public/data/etfs.json "${RUNNER_TEMP}/etf/previous.json"
          cp taiwan_etf_list.html "${RUNNER_TEMP}/etf/previous.html"
          cp app/public/data/us_etfs.json "${RUNNER_TEMP}/etf/previous_us.json" || true

      - name: 抓取 ETF 名單（TWSE / TPEx / FinMind）
        run: python scripts/fetch_universe.py "$WORK"

      - name: 抓取基本資料（保管銀行、配息、殖利率）
        run: python scripts/scrape_moneydj.py "$WORK"

      # 交易所公告的除息金額。證交所可以回補歷史（一年一次請求），櫃買只給
      # 當前清單 —— 所以這一步每天跑，櫃買那半的歷史是靠日積月累補起來的。
      # 產出進版控，是累積式的合併而不是重寫。
      - name: 抓取交易所公告的配息金額
        run: python scripts/fetch_dividends.py

      # 報酬率改由 FinLab 計算。MoneyDJ 那邊只剩 Basic0004（保管銀行／配息／殖利率），
      # 對他們的請求量因此少了一半。
      - name: 計算報酬率（FinLab）
        if: ${{ github.event.inputs.skip_returns != 'true' }}
        run: python scripts/fetch_tw_returns.py "$WORK"

      - name: 產生 React 版資料
        run: python scripts/build_data.py "$WORK" app/public/data/etfs.json

      - name: 重建舊版單頁
        run: python scripts/build_page.py "$WORK" taiwan_etf_list.html

      - name: 驗證資料（與前一版比對，異常就不提交）
        run: python scripts/verify_data.py app/public/data/etfs.json "${WORK}/previous.json"

      - name: 驗證舊版單頁
        run: python scripts/verify_page.py taiwan_etf_list.html "${WORK}/previous.html"

      # 美股清單跟著台股一起更新。它是公開的衍生統計（代號名稱來自 Nasdaq
      # 公開檔案，報酬率由我們計算），所以可以進版控；價格序列則否。
      - name: 更新美股清單
        run: |
          python scripts/fetch_us_etfs.py
          python scripts/verify_us_data.py app/public/data/us_etfs.json "${WORK}/previous_us.json"

      - name: 測試
        run: |
          cd app && npm test
          cd .. && node scripts/test_sort.js taiwan_etf_list.html

      - name: 提交變更
        id: commit
        run: |
          if git diff --quiet -- app/public/data/etfs.json app/public/data/us_etfs.json                app/public/data/dividends.json taiwan_etf_list.html; then
            echo "資料無變動，不提交"
            echo "changed=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          TOTAL=$(python -c "import json;print(json.load(open('app/public/data/etfs.json',encoding='utf-8'))['meta']['total'])")
          SNAP=$(python -c "import json;print(json.load(open('app/public/data/etfs.json',encoding='utf-8'))['meta']['snapshot'])")

          # 新上市的 ETF 寫進 commit 訊息，從 git log 就看得到哪天多了哪幾檔。
          # fetch_universe.py 每次都重新向交易所要完整名單，所以新掛牌的會自動出現。
          NEW=$(python scripts/diff_listings.py "${WORK}/previous.json" app/public/data/etfs.json)

          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/public/data/etfs.json app/public/data/us_etfs.json                   app/public/data/dividends.json taiwan_etf_list.html
          if [ -n "$NEW" ]; then
            git commit -m "資料：每日更新（${TOTAL} 檔，報酬率截至 ${SNAP}）" -m "新上市：${NEW}"
            echo "::notice title=新上市 ETF::${NEW}"
          else
            git commit -m "資料：每日更新（${TOTAL} 檔，報酬率截至 ${SNAP}）"
          fi
          git push
          echo "changed=true" >> $GITHUB_OUTPUT

      - name: 失敗時保留爬蟲錯誤紀錄
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-errors
          path: |
            ${{ runner.temp }}/etf/*errors*.txt
            ${{ runner.temp }}/etf/universe.tsv
          if-no-files-found: ignore
          retention-days: 14

      - name: 還原未通過驗證的資料
        if: failure()
        run: |
          git checkout -- app/public/data/etfs.json app/public/data/us_etfs.json                           app/public/data/dividends.json taiwan_etf_list.html || true

  # GITHUB_TOKEN 推的 commit 不會觸發 push 事件，所以這裡主動呼叫部署流程
  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    # 一天一次的重抓就在這裡。其他時候（程式碼推送）部署會沿用快取，
    # 不動用 FinLab 流量。
    with:
      refresh_finlab: true
    # workflow_call 不會自動把 secrets 傳給被呼叫的流程。少了這行，部署端就拿不到
    # FINLAB_API_TOKEN 與 SITE_PASSWORD，績效曲線會被靜默跳過。
    secrets: inherit
    permissions:
      contents: read
      pages: write
      id-token: write
