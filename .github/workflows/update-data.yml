name: 每日更新 ETF 資料

# 台灣時間每個交易日 19:00（= UTC 11:00）。台股 13:30 收盤，MoneyDJ 傍晚才更新完報酬率。
# 要改時間就改下面的 cron：GitHub 用 UTC，台灣時間減 8 小時。
# 例：台灣 21:00 -> '0 13 * * 1-5'；台灣 08:00 -> '0 0 * * 2-6'（跨日，星期往後移一天）
on:
  schedule:
    - cron: '0 11 * * 1-5'
  workflow_dispatch:
    inputs:
      skip_returns:
        description: '略過報酬率計算（只更新名單／保管銀行／配息）'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

# 這個流程分成七個互相獨立的區塊，各自產出自己那幾個檔案：
#
#   配息   dividends.json, yields.json          交易所公告，不碰 FinLab／MoneyDJ
#   台股   etfs.json, taiwan_etf_list.html      名單 + MoneyDJ + FinLab 報酬率
#   美股   us_etfs.json                         Nasdaq 名單 + FinLab 價格
#   價平和 atm.json                             期交所選擇權行情（累積式）
#   個股   fin_history.json                     公開資訊觀測站（累積式）
#   散戶   retail.json                          期交所三大法人＋全市場未沖銷（累積式）
#   換股   active_holdings.json                 各投信官網的主動式 ETF 持股（累積式）
#
# **一個區塊失敗不會擋住其他區塊。** 失敗的那一組會被 git checkout 還原成前一版
# （擱置到下次），其餘照常提交並部署。理由是 2026-09-22 那次：美股那步因為 FinLab
# 擴編了資料集而被驗證器擋下，整天的台股資料、配息、價平和、個股財報跟著全部沒進版，
# 網站停在五天前 —— 但那四塊其實全都跑完而且通過驗證了。
#
# 有東西被擱置時這個 job 仍然算失敗（紅色，才看得到），但 deploy 照樣跑，
# 所以網站拿得到當天更新的那幾塊。
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FINLAB_API_TOKEN: ${{ secrets.FINLAB_API_TOKEN }}
      # 每個區塊負責的檔案。還原與提交都照這份清單，不要各寫一份。
      DIV_FILES: app/public/data/dividends.json app/public/data/yields.json
      TW_FILES: app/public/data/etfs.json taiwan_etf_list.html
      US_FILES: app/public/data/us_etfs.json
      ATM_FILES: app/public/data/atm.json
      STOCK_FILES: app/public/data/fin_history.json
      RETAIL_FILES: app/public/data/retail.json
      HOLD_FILES: app/public/data/active_holdings.json
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      pending: ${{ steps.tidy.outputs.pending }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: 安裝相依套件
        run: |
          # 鎖版本，理由同 deploy.yml：這個 job 也帶著 FINLAB_API_TOKEN。
          pip install --quiet certifi==2026.7.22 finlab==2.0.19
          cd app && npm ci

      # 前置檢查只決定「哪幾個區塊有條件跑」，不再中止整次更新。
      # 早點知道還是有價值的：沒有 FinLab 憑證就別爬完 359 頁 MoneyDJ 才發現
      # 報酬率全是 N/A；MoneyDJ 連不上就別讓爬蟲跑 20 分鐘收集錯誤頁。
      - name: 前置檢查（憑證與來源連線）
        id: pre
        run: |
          if [ -z "$FINLAB_API_TOKEN" ]; then
            echo "::warning title=缺少 FINLAB_API_TOKEN::報酬率由 FinLab 計算，台股與美股這兩塊會擱置。到 Settings → Secrets and variables → Actions 建立這個 secret（本機的 .env 不會上傳，CI 看不到）。"
            echo "finlab=false" >> $GITHUB_OUTPUT
          else
            echo "FinLab 憑證已設定（長度 ${#FINLAB_API_TOKEN}）"
            echo "finlab=true" >> $GITHUB_OUTPUT
          fi

          code=$(curl -sS -o /dev/null -w '%{http_code}' -m 30 \
            -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/122.0 Safari/537.36' \
            'https://www.moneydj.com/ETF/X/Basic/Basic0004.xdjhtm?etfid=0050.tw' || echo 000)
          echo "MoneyDJ: HTTP $code"
          if [ "$code" = "200" ]; then
            echo "moneydj=true" >> $GITHUB_OUTPUT
          else
            echo "::warning title=MoneyDJ 無法連線::保管銀行與配息頻率來自 MoneyDJ，台股那塊會擱置（既有資料保持不變）。"
            echo "moneydj=false" >> $GITHUB_OUTPUT
          fi

      - name: 建立工作目錄並保留前一版
        run: |
          echo "WORK=${RUNNER_TEMP}/etf" >> $GITHUB_ENV
          mkdir -p "${RUNNER_TEMP}/etf"
          cp app/public/data/etfs.json "${RUNNER_TEMP}/etf/previous.json"
          cp taiwan_etf_list.html "${RUNNER_TEMP}/etf/previous.html"
          cp app/public/data/us_etfs.json "${RUNNER_TEMP}/etf/previous_us.json" || true

      # 一週一把鑰匙（ISO 年+週），新的一週自然抓不到上週的快取
      - name: 本週的快取鑰匙
        id: week
        run: echo "key=$(date -u +%G-W%V)" >> $GITHUB_OUTPUT

      - name: 今天的快取鑰匙
        id: day
        run: echo "key=$(date -u +%Y-%m-%d)" >> $GITHUB_OUTPUT

      # ── 區塊一：配息與殖利率 ────────────────────────────────────────────
      # 全部是交易所的免費端點，不依賴 FinLab 也不依賴 MoneyDJ，所以放最前面：
      # 後面幾塊掛掉時，這塊仍然會進版。
      #
      # 交易所公告的除息金額：證交所可以回補歷史（一年一次請求），櫃買只給當前清單
      # —— 所以這一步每天跑，櫃買那半的歷史是靠日積月累補起來的。產出是累積式合併。
      # 殖利率＝近 12 個月配息 ÷ 當日收盤價，兩邊都是免費端點。
      - name: 配息與殖利率
        id: div
        continue-on-error: true
        run: |
          set -e
          python scripts/fetch_dividends.py
          python scripts/fetch_yields.py

      # ── 區塊二：台股清單 ───────────────────────────────────────────────
      - name: 取回本週的 MoneyDJ 快照
        id: mdjcache
        if: ${{ steps.pre.outputs.moneydj == 'true' }}
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/etf/pages
          key: moneydj-pages-${{ steps.week.outputs.key }}

      # FinLab 的資料集存放處。兩個流程都要 etl:adj_close，各自下載就是雙倍流量；
      # 快取起來之後，當天第二個 job 讀的是本機檔案。finlab 自己有 expiry，
      # 資料更新了它會重抓，所以不會拿到過期的東西。
      - name: 取回 FinLab 資料集快取
        if: ${{ steps.pre.outputs.finlab == 'true' }}
        uses: actions/cache/restore@v4
        with:
          path: .cache/finlab_db
          key: finlab-db-${{ steps.day.outputs.key }}
          restore-keys: |
            finlab-db-

      # MoneyDJ 的 Basic0004 每週抓一次就夠：保管銀行與配息頻率幾乎不會變，
      # 而每天都在變的殖利率已經改成自己算（區塊一）。
      #
      # 減量是靠快取的鑰匙做的，腳本本身不用改 —— 它本來就會跳過已經存在的頁面。
      # 鑰匙帶週數：新的一週抓不到快取，就重新抓完整的 359 頁；同一週內只會抓
      # 快取裡沒有的（也就是新上市的那幾檔）。每日請求量因此少了大約 85%。
      - name: 台股清單（名單、基本資料、報酬率、兩個前端）
        id: tw
        if: ${{ steps.pre.outputs.moneydj == 'true' && (steps.pre.outputs.finlab == 'true' || github.event.inputs.skip_returns == 'true') }}
        continue-on-error: true
        run: |
          set -e
          echo "::group::抓取 ETF 名單（TWSE / TPEx / FinMind）"
          python scripts/fetch_universe.py "$WORK"
          echo "::endgroup::"

          echo "::group::抓取基本資料（保管銀行、配息頻率）"
          python scripts/scrape_moneydj.py "$WORK"
          echo "::endgroup::"

          if [ "${{ github.event.inputs.skip_returns }}" != "true" ]; then
            echo "::group::計算報酬率（FinLab）"
            python scripts/fetch_tw_returns.py "$WORK"
            echo "::endgroup::"
          fi

          echo "::group::產生兩個前端"
          python scripts/build_data.py "$WORK" app/public/data/etfs.json
          python scripts/build_page.py "$WORK" taiwan_etf_list.html
          echo "::endgroup::"

          # 驗證與測試留在這一組裡面：不通過就只還原這一組，不影響其他四塊。
          python scripts/verify_data.py app/public/data/etfs.json "${WORK}/previous.json"
          python scripts/verify_page.py taiwan_etf_list.html "${WORK}/previous.html"
          node scripts/test_sort.js taiwan_etf_list.html
          cd app && node --test tests/filters.test.ts

      - name: 存下本週的 MoneyDJ 快照
        if: ${{ steps.mdjcache.outcome == 'success' && steps.mdjcache.outputs.cache-hit != 'true' && hashFiles(format('{0}/etf/pages/*', runner.temp)) != '' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/etf/pages
          key: moneydj-pages-${{ steps.week.outputs.key }}

      # ── 區塊三：美股清單 ───────────────────────────────────────────────
      # 它是公開的衍生統計（代號名稱來自 Nasdaq 公開檔案，報酬率由我們計算），
      # 所以可以進版控；價格序列則否。
      - name: 美股清單
        id: us
        if: ${{ steps.pre.outputs.finlab == 'true' }}
        continue-on-error: true
        run: |
          set -e
          python scripts/fetch_us_etfs.py
          python scripts/verify_us_data.py app/public/data/us_etfs.json "${WORK}/previous_us.json"

      # ── 區塊四：週選價平和 ─────────────────────────────────────────────
      # 期交所的每日行情收盤後就發布，所以這裡記的是「今天收盤」，也就是明天開盤前
      # 會看到的那個數字。累積式，要進版控。
      - name: 週選價平和
        id: atm
        continue-on-error: true
        run: |
          set -e
          python scripts/fetch_atm.py
          cd app && node --test tests/atm.test.ts

      # ── 區塊五：個股財報 ───────────────────────────────────────────────
      # 那些端點只回當期，所以 fin_history.json 是逐期累積的，而且要進版控 ——
      # 累積發生在這個會 commit 的流程裡，部署流程只負責讀它產出畫面用的檔。
      # --no-chips：籌碼是每天變的，交給部署流程與它的快取。
      - name: 個股財報
        id: stocks
        continue-on-error: true
        run: python scripts/fetch_stocks.py --no-chips

      # ── 區塊六：散戶多空比 ─────────────────────────────────────────────
      # 期交所的三大法人資料只保留約三年，所以跟價平和一樣逐日累積、進版控，
      # 驗收「散戶多空比準不準」才有越來越長的歷史。平常只補最近幾天，幾個請求。
      - name: 散戶多空比
        id: retail
        continue-on-error: true
        run: |
          set -e
          python scripts/fetch_retail.py
          cd app && node --test tests/retail.test.ts

      # ── 區塊七：主動式 ETF 換股 ─────────────────────────────────────────
      # 各投信每個交易日收盤後公告持股（統一 16:30 前後），19:00 這一輪一定拿得到。
      # 平常只問最近三個交易日，每檔三個請求。
      - name: 主動式換股
        id: hold
        continue-on-error: true
        run: |
          set -e
          python scripts/fetch_active_holdings.py
          cd app && node --test tests/active.test.ts

      - name: 存下 FinLab 資料集快取
        if: ${{ hashFiles('.cache/finlab_db/*') != '' }}
        uses: actions/cache/save@v4
        with:
          path: .cache/finlab_db
          key: finlab-db-${{ steps.day.outputs.key }}-${{ github.run_id }}

      # 沒跑成功的區塊在這裡還原成前一版，於是下一步的 git diff 只會看到成功的那幾塊。
      - name: 整理未完成的區塊
        id: tidy
        run: |
          pending=""
          note() {
            name="$1"; outcome="$2"; shift 2
            if [ "$outcome" = "success" ]; then
              return 0
            fi
            if [ "$outcome" = "skipped" ]; then
              echo "::warning title=${name} 未執行::前置條件不足，這一區塊擱置到下次，保留前一版資料。"
            else
              echo "::error title=${name} 更新失敗::這一區塊擱置到下次，保留前一版資料（其他區塊照常更新）。"
            fi
            git checkout -- "$@" 2>/dev/null || true
            pending="${pending:+${pending}、}${name}"
          }
          note 配息與殖利率 '${{ steps.div.outcome }}'    $DIV_FILES
          note 台股清單     '${{ steps.tw.outcome }}'     $TW_FILES
          note 美股清單     '${{ steps.us.outcome }}'     $US_FILES
          note 週選價平和   '${{ steps.atm.outcome }}'    $ATM_FILES
          note 個股財報     '${{ steps.stocks.outcome }}' $STOCK_FILES
          note 散戶多空比   '${{ steps.retail.outcome }}' $RETAIL_FILES
          note 主動式換股   '${{ steps.hold.outcome }}'   $HOLD_FILES

          echo "pending=${pending}" >> $GITHUB_OUTPUT
          {
            echo "### 這次更新的區塊"
            echo ""
            echo "| 區塊 | 結果 |"
            echo "| --- | --- |"
            echo "| 配息與殖利率 | ${{ steps.div.outcome }} |"
            echo "| 台股清單 | ${{ steps.tw.outcome }} |"
            echo "| 美股清單 | ${{ steps.us.outcome }} |"
            echo "| 週選價平和 | ${{ steps.atm.outcome }} |"
            echo "| 個股財報 | ${{ steps.stocks.outcome }} |"
            echo "| 散戶多空比 | ${{ steps.retail.outcome }} |"
            echo "| 主動式換股 | ${{ steps.hold.outcome }} |"
          } >> $GITHUB_STEP_SUMMARY

      - name: 提交變更
        id: commit
        run: |
          FILES="$DIV_FILES $TW_FILES $US_FILES $ATM_FILES $STOCK_FILES $RETAIL_FILES $HOLD_FILES"
          if git diff --quiet -- $FILES; then
            echo "資料無變動，不提交"
            echo "changed=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # 標題用台股的檔數與報酬率日期；台股那塊擱置時它就是前一版的數字，
          # 所以訊息裡另外寫明這次更新了哪幾個檔案、擱置了哪幾塊。
          TOTAL=$(python -c "import json;print(json.load(open('app/public/data/etfs.json',encoding='utf-8'))['meta']['total'])")
          SNAP=$(python -c "import json;print(json.load(open('app/public/data/etfs.json',encoding='utf-8'))['meta']['snapshot'])")
          UPDATED=$(git diff --name-only -- $FILES | tr '\n' ' ')

          # 新上市的 ETF 寫進 commit 訊息，從 git log 就看得到哪天多了哪幾檔。
          # fetch_universe.py 每次都重新向交易所要完整名單，所以新掛牌的會自動出現。
          NEW=$(python scripts/diff_listings.py "${WORK}/previous.json" app/public/data/etfs.json)

          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add $FILES

          BODY="更新：${UPDATED}"
          PENDING='${{ steps.tidy.outputs.pending }}'
          if [ -n "$PENDING" ]; then
            BODY="${BODY}"$'\n'"擱置：${PENDING}（保留前一版）"
          fi
          if [ -n "$NEW" ]; then
            BODY="${BODY}"$'\n'"新上市：${NEW}"
            echo "::notice title=新上市 ETF::${NEW}"
          fi
          git commit -m "資料：每日更新（${TOTAL} 檔，報酬率截至 ${SNAP}）" -m "${BODY}"
          git push
          echo "changed=true" >> $GITHUB_OUTPUT

      # 其餘測試。放在提交之後：它們吃的是不會被這個流程改到的資料與純邏輯，
      # 失敗是程式的問題，不該讓當天的資料退回去。
      - name: 測試
        id: tests
        continue-on-error: true
        run: cd app && npm test

      - name: 失敗時保留爬蟲錯誤紀錄
        if: ${{ steps.tw.outcome != 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: scrape-errors
          path: |
            ${{ runner.temp }}/etf/*errors*.txt
            ${{ runner.temp }}/etf/universe.tsv
          if-no-files-found: ignore
          retention-days: 14

      # 有區塊擱置就讓這個 job 紅燈 —— 已經提交的那幾塊不會因此退回，
      # 下面的 deploy 也照樣跑（它的條件是 always()）。
      - name: 回報擱置的區塊
        if: ${{ steps.tidy.outputs.pending != '' || steps.tests.outcome != 'success' }}
        run: |
          PENDING='${{ steps.tidy.outputs.pending }}'
          if [ -n "$PENDING" ]; then
            echo "::error::以下區塊這次沒有更新：${PENDING}"
          fi
          if [ "${{ steps.tests.outcome }}" != "success" ]; then
            echo "::error::測試未通過（資料已提交，這是程式的問題）"
          fi
          exit 1

  # GITHUB_TOKEN 推的 commit 不會觸發 push 事件，所以這裡主動呼叫部署流程。
  # always()：上面那個 job 可能因為有區塊擱置而紅燈，但成功的那幾塊已經進版了，
  # 網站該拿到它們。changed 是提交步驟給的，job 失敗也讀得到。
  deploy:
    needs: update
    if: ${{ always() && needs.update.outputs.changed == 'true' }}
    uses: ./.github/workflows/deploy.yml
    # 一天一次的重抓就在這裡。其他時候（程式碼推送）部署會沿用快取，
    # 不動用 FinLab 流量。
    with:
      refresh_finlab: true
    # workflow_call 不會自動把 secrets 傳給被呼叫的流程。少了這行，部署端就拿不到
    # FINLAB_API_TOKEN 與 SITE_PASSWORD，績效曲線會被靜默跳過。
    secrets: inherit
    permissions:
      contents: read
      pages: write
      id-token: write
