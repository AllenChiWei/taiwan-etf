name: 部署到 GitHub Pages

# push 到 main 時自動部署；也提供 workflow_call，讓每日更新流程在 commit 後直接呼叫。
# （用 GITHUB_TOKEN 推的 commit 不會觸發 push 事件，所以更新流程必須主動呼叫，
#   否則資料更新後網站不會重新部署。）
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'scripts/**'
      - 'taiwan_etf_list.html'
      - '.github/workflows/deploy.yml'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時只跑一個部署。不取消進行中的那個，免得站台停在半完成狀態。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FINLAB_API_TOKEN: ${{ secrets.FINLAB_API_TOKEN }}
      SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
      # salt 隨 manifest 公開給瀏覽器，不是機密；固定它是為了讓部署不會
      # 讓所有人的工作階段失效。用 repository variable 就夠了。
      SITE_SALT: ${{ vars.SITE_SALT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安裝相依套件
        run: |
          pip install --quiet finlab cryptography
          cd app && npm ci

      # FinLab 衍生的資料（美股清單、績效曲線）刻意不進版控：明文放在公開 repo 等於
      # 沒加密，而曲線每天全部重算會讓 repo 每年膨脹數百 MB。改成部署時即時產生。
      - name: 產生美股資料與績效曲線
        id: finlab
        if: ${{ env.FINLAB_API_TOKEN != '' }}
        run: |
          python scripts/fetch_us_etfs.py
          python scripts/verify_us_data.py app/public/data/us_etfs.json
          python scripts/fetch_series.py
          echo "generated=true" >> $GITHUB_OUTPUT

      - name: 加密受保護的資料
        if: ${{ steps.finlab.outputs.generated == 'true' }}
        run: |
          if [ -z "$SITE_PASSWORD" ]; then
            echo "::error::已產生 FinLab 資料但沒有設定 SITE_PASSWORD secret。"
            echo "::error::未加密就部署等於公開付費訂閱的資料，因此中止。"
            exit 1
          fi
          python scripts/encrypt_data.py

      - name: 沒有 FinLab 憑證時的提醒
        if: ${{ env.FINLAB_API_TOKEN == '' }}
        run: |
          echo "::warning::沒有 FINLAB_API_TOKEN secret，這次部署不含美股資料與績效曲線。"
          echo "::warning::台股清單不受影響（來自公開的 TWSE/TPEx/MoneyDJ）。"

      - name: 確認沒有明文外洩到建置產物
        run: |
          # 最後一道防線：FinLab 的明文絕不能出現在要上線的檔案裡。
          # 加密腳本會刪掉明文，這裡確認它真的做到了。
          leaked=$(find app/public/data \( -name 'us_etfs.json' -o \
                     \( -path '*/series/*' -name '*.json' \) \) | head -5)
          if [ -n "$leaked" ]; then
            echo "::error::建置產物含未加密的 FinLab 資料："
            echo "$leaked"
            exit 1
          fi
          echo "檢查通過：沒有未加密的 FinLab 資料"

      - name: 驗證台股資料
        run: python scripts/verify_data.py app/public/data/etfs.json

      - name: 測試
        working-directory: app
        run: npm test

      - name: 建置
        working-directory: app
        run: npm run build

      - name: 保留舊版單頁（既有連結不要壞掉）
        # 轉換期間兩個前端並存：新站是根目錄，舊的單檔版留在原網址。
        # 等新版穩定一段時間後可以拿掉這一步。
        run: cp taiwan_etf_list.html app/dist/taiwan_etf_list.html

      - uses: actions/configure-pages@v5
        with:
          # 只在 Pages 尚未啟用時才會建立站台；它「不會」改變已啟用站台的來源設定。
          # 來源必須是 Settings → Pages → Source = GitHub Actions，否則內建的
          # 分支建置會同時執行，而且因為晚幾秒完成而覆蓋掉這裡的產物。
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
