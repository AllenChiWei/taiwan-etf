name: 部署到 GitHub Pages

# push 到 main 時自動部署；也提供 workflow_call，讓每日更新流程在 commit 後直接呼叫。
# （用 GITHUB_TOKEN 推的 commit 不會觸發 push 事件，所以更新流程必須主動呼叫，
#   否則資料更新後網站不會重新部署。）
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'scripts/**'
      - 'taiwan_etf_list.html'
      - '.github/workflows/deploy.yml'
  workflow_call:
    inputs:
      refresh_finlab:
        description: 從 FinLab 重新產生績效曲線與試算資料
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      refresh_finlab:
        description: 從 FinLab 重新產生績效曲線與試算資料（會吃掉每日流量）
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

# 同時只跑一個部署。不取消進行中的那個，免得站台停在半完成狀態。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FINLAB_API_TOKEN: ${{ secrets.FINLAB_API_TOKEN }}
      # FinLab 的流量是按下載量計費的（5 GB／日），而 etl:adj_close 這種矩陣
      # 一抓就是數百 MB。一天推四次程式碼就抓四次，額度當天就見底 ——
      # 實際發生過，結果是後面每一次部署都失敗。
      #
      # 所以只有每日更新流程（與手動勾選）會重抓；一般的程式碼推送沿用上一次
      # 產生好的資料。inputs 在 push 事件下是空的，所以預設就是「沿用」。
      REFRESH_FINLAB: ${{ inputs.refresh_finlab && 'true' || 'false' }}
      # SITE_PASSWORD 不放在 job 層級：放這裡的話，每一個步驟（包括 pip install
      # 與它拉進來的第三方套件）都讀得到它。只有加密那一步需要，就只給那一步。
      # FINLAB_API_TOKEN 留在這裡是因為步驟的 if: 條件要判斷它在不在。
      # salt 隨 manifest 公開給瀏覽器，不是機密；固定它是為了讓部署不會
      # 讓所有人的工作階段失效。用 repository variable 就夠了。
      SITE_SALT: ${{ vars.SITE_SALT }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 一律取 main 的最新內容。被 update-data 以 workflow_call 呼叫時，
          # 預設會 checkout「觸發當下」的 commit —— 那是機器人推送資料之前的版本，
          # 結果就是資料更新了、部署出去的卻是舊的。
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安裝相依套件
        run: |
          # 鎖版本：這個 job 握著 FINLAB_API_TOKEN，pip 抓到被動過手腳的新版就等於
          # 把 token 交出去。鎖住之後升級要手動改這裡 —— 那個麻煩是刻意換來的。
          # 版本要往上帶時，先在本機跑一次 fetch_series.py 與 fetch_calc.py 確認。
          pip install --quiet finlab==2.0.19 cryptography==50.0.1
          cd app && npm ci

      # 上一次產生的 FinLab 資料（已加密的序列、試算資料、解鎖 manifest）。
      # 這三樣是一組：序列是用 manifest 裡的參數加密的，所以要嘛一起沿用、
      # 要嘛一起重新產生，不能只換一邊。
      - name: 取回上次的 FinLab 資料
        id: datacache
        uses: actions/cache/restore@v4
        with:
          path: |
            app/public/data/series
            app/public/data/calc
            app/public/data/secure.json
          key: finlab-data-${{ github.run_id }}
          restore-keys: |
            finlab-data-

      - name: 決定要不要重抓 FinLab
        id: plan
        run: |
          # 有可用的舊資料、又不是明確要求重抓，就沿用
          if [ -f app/public/data/calc/index.json ] && [ "$REFRESH_FINLAB" != "true" ]; then
            echo "reuse=true" >> $GITHUB_OUTPUT
            echo "沿用上次的 FinLab 資料（沒有動用今天的流量）"
          else
            echo "reuse=false" >> $GITHUB_OUTPUT
            if [ "$REFRESH_FINLAB" = "true" ]; then
              echo "這次要重抓 FinLab（每日更新或手動指定）"
            else
              echo "::warning::沒有可沿用的 FinLab 資料，這次會重抓"
            fi
          fi

      # 重抓之前先把沿用到的那份留一份備份。FinLab 掛掉或額度用完時（兩種都遇過）
      # 就退回這一份 —— 資料舊一天，但試算與圖表都還在，而且不相關的新功能照樣上線。
      - name: 備份可沿用的資料
        id: backup
        if: ${{ hashFiles('app/public/data/calc/index.json') != '' }}
        run: |
          mkdir -p .cache/prev
          cp -r app/public/data/calc .cache/prev/
          [ -d app/public/data/series ] && cp -r app/public/data/series .cache/prev/ || true
          [ -f app/public/data/secure.json ] && cp app/public/data/secure.json .cache/prev/ || true
          echo "已備份可沿用的資料"

      # 美股清單已在版控中（每日更新流程會提交它）。這裡只產生價格序列：
      # 那是 11 MB、每天全部重算，進版控會讓 repo 每年膨脹數百 MB。
      # 沒有 FinLab 憑證時網站照常運作，只是沒有績效圖。
      - name: 產生績效曲線
        id: finlab
        if: ${{ env.FINLAB_API_TOKEN != '' && steps.plan.outputs.reuse != 'true' }}
        # 失敗不直接中止：下面的「退回上一份資料」會接手，沒有舊資料時才真的失敗
        continue-on-error: true
        run: |
          python scripts/fetch_series.py
          echo "generated=true" >> $GITHUB_OUTPUT

      # 試算用的月頻價格與配息。這份**不加密**：月頻收盤價與除息金額本來就是
      # 交易所與投信公開的資訊，這裡只是整理成月度摘要，不是那份按日的付費資料集。
      # 不加密，計算機才能免密碼使用。
      - name: 產生試算資料
        id: calc
        if: ${{ env.FINLAB_API_TOKEN != '' && steps.plan.outputs.reuse != 'true' }}
        continue-on-error: true
        run: python scripts/fetch_calc.py

      # 新聞與重大訊息。同樣不需要 FinLab，也同樣容許失敗：媒體或觀測站掛掉時
      # 新聞頁自己會說「還沒有資料」，不該連帶讓整個網站不能部署。
      - name: 產生新聞資料
        continue-on-error: true
        run: python scripts/fetch_news.py

      # 籌碼面（期交所三大法人／大額交易人、交易所法人買賣超）。不需要 FinLab，
      # 來源都是公開端點。continue-on-error 是刻意的：交易所偶爾維護或逾時，
      # 那不該讓整個網站的部署失敗 —— 缺檔時籌碼頁自己會說「今天還沒有資料」。
      - name: 產生籌碼資料
        continue-on-error: true
        run: python scripts/fetch_chips.py

      # FinLab 失敗（額度用完、服務中斷、或改版）時退回備份。半途失敗的產出不能
      # 只補一半 —— 那會混出一份新舊相間的資料，所以整組換回去。
      - name: 重抓失敗時退回上一份資料
        if: ${{ steps.finlab.outcome == 'failure' || steps.calc.outcome == 'failure' }}
        run: |
          rm -rf app/public/data/calc app/public/data/series app/public/data/secure.json
          if [ -d .cache/prev/calc ]; then
            cp -r .cache/prev/calc app/public/data/
            [ -d .cache/prev/series ] && cp -r .cache/prev/series app/public/data/ || true
            [ -f .cache/prev/secure.json ] && cp .cache/prev/secure.json app/public/data/ || true
            echo "::warning title=FinLab 抓取失敗::已退回快取裡的上一份資料，日期會比今天舊。常見原因是每日流量用完。"
          elif python scripts/reuse_calc.py; then
            # 快取被淘汰、或這個機制剛啟用還沒有快取。直接抓線上那份試算資料。
            # 績效曲線沒有一起抓（1000 多個加密檔），所以圖表這次會缺。
            echo "::warning title=FinLab 抓取失敗::已改用線上那份試算資料；這次的部署不含績效曲線。"
          else
            echo "::error title=FinLab 抓取失敗::而且沒有任何可退回的資料，這次不部署（線上維持前一版）。"
            exit 1
          fi

      # continue-on-error 會把失敗的步驟記成 conclusion=success，在 Actions 的畫面上
      # 看不出哪裡少了東西（籌碼第一次上線就是這樣靜靜地缺掉）。這一步把結果講清楚。
      - name: 檢查選配資料是否齊備
        if: ${{ always() }}
        run: |
          for f in chips news; do
            path="app/public/data/$f.json"
            if [ -f "$path" ]; then
              echo "$f.json 已產生（$(wc -c < "$path") bytes）"
              # meta.errors 是資料自己記下的缺漏（某個來源拒絕連線之類）
              python -c "import io,json,sys;d=json.load(io.open(sys.argv[1],encoding='utf-8'));[print('::warning title=%s 有缺漏::%s'%(sys.argv[2],e)) for e in (d.get('meta') or {}).get('errors') or []]" "$path" "$f"
            else
              echo "::warning title=$f.json 沒有產生::這次部署不含這一頁的資料，頁面會顯示「還沒有資料」。"
            fi
          done

      - name: 加密受保護的資料
        if: ${{ steps.finlab.outputs.generated == 'true' }}
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: |
          if [ -z "$SITE_PASSWORD" ]; then
            # 沒有密碼就不能加密，而未加密的付費資料絕不能上線。但也不該因此
            # 讓整個部署掛掉 —— 台股與美股表格是公開資料，不該被圖表的設定缺失連累。
            # 丟掉曲線、照常部署，圖表會顯示「這個部署版本沒有包含績效曲線」。
            echo "::warning title=缺少 SITE_PASSWORD::績效曲線已產生但無法加密，本次部署將不包含它。"
            echo "::warning::到 Settings → Secrets 建立 SITE_PASSWORD 即可啟用圖表。"
            # 只丟曲線。試算資料本來就是明文的，不受密碼有無影響。
            rm -rf app/public/data/series
            exit 0
          fi
          python scripts/encrypt_data.py

      - name: 沒有 FinLab 憑證時的提醒
        if: ${{ env.FINLAB_API_TOKEN == '' && steps.plan.outputs.reuse != 'true' }}
        run: |
          echo "::warning::沒有 FINLAB_API_TOKEN secret，這次部署不含績效曲線與試算資料。"
          echo "::warning::台股與美股清單不受影響（兩份都在版控中）。"

      - name: 確認價格序列沒有以明文上線
        run: |
          # 最後一道防線。us_etfs.json 是公開的（代號名稱來自 Nasdaq 公開檔案，
          # 報酬率是我們自己算的衍生統計），但 series/ 底下是價格歷史本身，
          # 那才是付費資料集，絕不能以明文出現在產物裡。
          leaked=$(find app/public/data/series -name '*.json' 2>/dev/null | head -5)
          if [ -n "$leaked" ]; then
            echo "::error::建置產物含未加密的價格序列："
            echo "$leaked"
            exit 1
          fi
          echo "檢查通過：價格序列都已加密"

      # 存進快取給後續的程式碼推送用。一定要在上面那道明文檢查之後 ——
      # 不然可能把未加密的價格序列寫進快取。
      - name: 存下這次的 FinLab 資料
        if: ${{ steps.plan.outputs.reuse != 'true'
                && steps.finlab.outcome != 'failure' && steps.calc.outcome != 'failure'
                && hashFiles('app/public/data/calc/index.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: |
            app/public/data/series
            app/public/data/calc
            app/public/data/secure.json
          key: finlab-data-${{ github.run_id }}

      - name: 驗證資料
        run: |
          python scripts/verify_data.py app/public/data/etfs.json
          python scripts/verify_us_data.py app/public/data/us_etfs.json

      - name: 測試
        working-directory: app
        run: npm test

      - name: 建置
        working-directory: app
        run: npm run build

      - name: 保留舊版單頁（既有連結不要壞掉）
        # 轉換期間兩個前端並存：新站是根目錄，舊的單檔版留在原網址。
        # 等新版穩定一段時間後可以拿掉這一步。
        run: cp taiwan_etf_list.html app/dist/taiwan_etf_list.html

      - uses: actions/configure-pages@v5
        with:
          # 只在 Pages 尚未啟用時才會建立站台；它「不會」改變已啟用站台的來源設定。
          # 來源必須是 Settings → Pages → Source = GitHub Actions，否則內建的
          # 分支建置會同時執行，而且因為晚幾秒完成而覆蓋掉這裡的產物。
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
