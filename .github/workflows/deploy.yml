name: 部署到 GitHub Pages

# push 到 main 時自動部署；也提供 workflow_call，讓每日更新流程在 commit 後直接呼叫。
# （用 GITHUB_TOKEN 推的 commit 不會觸發 push 事件，所以更新流程必須主動呼叫，
#   否則資料更新後網站不會重新部署。）
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'scripts/**'
      - 'taiwan_etf_list.html'
      - '.github/workflows/deploy.yml'
  workflow_call:
    inputs:
      refresh_finlab:
        description: 從 FinLab 重新產生績效曲線與試算資料
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      refresh_finlab:
        description: 從 FinLab 重新產生績效曲線與試算資料（會吃掉每日流量）
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

# 同時只跑一個部署。不取消進行中的那個，免得站台停在半完成狀態。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FINLAB_API_TOKEN: ${{ secrets.FINLAB_API_TOKEN }}
      # FinLab 的流量是按下載量計費的（5 GB／日），而 etl:adj_close 這種矩陣
      # 一抓就是數百 MB。一天推四次程式碼就抓四次，額度當天就見底 ——
      # 實際發生過，結果是後面每一次部署都失敗。
      #
      # 所以只有每日更新流程（與手動勾選）會重抓；一般的程式碼推送沿用上一次
      # 產生好的資料。inputs 在 push 事件下是空的，所以預設就是「沿用」。
      REFRESH_FINLAB: ${{ inputs.refresh_finlab && 'true' || 'false' }}
      # 每個市場單輪最多抓幾檔。FinMind 免費層每小時 300 次、有 token 是 600，
      # 兩個市場平分。抓不完不是問題：輪替會讓下一輪接著補（見 finmind_series.py）。
      FINMIND_BUDGET: ${{ secrets.FINMIND_TOKEN != '' && '280' || '140' }}
      # FINLAB_API_TOKEN 放在這裡是因為步驟的 if: 條件要判斷它在不在。
      # 加密相關的 SITE_PASSWORD／SITE_SALT 已經沒有步驟需要 —— 兩個市場的曲線
      # 都改用 FinMind 之後，上線的資料裡沒有付費內容了。要接回去時，秘密只給
      # 需要的那一步，不要放在 job 層級（那樣連 pip 裝進來的套件都讀得到）。
    steps:
      - uses: actions/checkout@v4
        with:
          # 一律取 main 的最新內容。被 update-data 以 workflow_call 呼叫時，
          # 預設會 checkout「觸發當下」的 commit —— 那是機器人推送資料之前的版本，
          # 結果就是資料更新了、部署出去的卻是舊的。
          ref: main

      # checkout 取的是「這個 job 啟動當下」的 main。兩個部署重疊時（程式碼推送撞上
      # 每日更新），concurrency 不取消進行中的那個，所以**最後完成的那個決定站上是
      # 什麼** —— 早啟動、晚完成的那個會把新資料蓋回舊版。
      #
      # 2026-09-23 實際發生：23:41 的推送部署帶著 3ac3ffe（舊資料），每日更新在
      # 23:44 提交 d0a1929（新的殖利率）並部署完成，然後那個推送部署才完成，
      # 站上的殖利率就退回去了。查了兩輪才發現 run 全綠但內容是舊的。
      #
      # 開始建置前再抓一次 main，晚完成的那個至少不會比先完成的還舊。
      - name: 建置前對齊 main 的最新內容
        run: |
          git fetch --depth=1 origin main
          git checkout -q FETCH_HEAD
          git log -1 --format='建置的 commit：%h %s'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安裝相依套件
        run: |
          # 鎖版本：這個 job 握著 FINLAB_API_TOKEN，pip 抓到被動過手腳的新版就等於
          # 把 token 交出去。鎖住之後升級要手動改這裡 —— 那個麻煩是刻意換來的。
          # 版本要往上帶時，先在本機跑一次 fetch_series.py 與 fetch_calc.py 確認。
          pip install --quiet finlab==2.0.19 cryptography==50.0.1
          cd app && npm ci

      # FinLab 的資料集存放處，與每日更新流程共用同一把鑰匙：那個流程當天已經
      # 下載過 etl:adj_close，這裡就不必再抓一次（一次一百多 MB）。
      - name: 今天的快取鑰匙
        id: day
        run: echo "key=$(date -u +%Y-%m-%d)" >> $GITHUB_OUTPUT

      - name: 取回 FinLab 資料集快取
        uses: actions/cache/restore@v4
        with:
          path: .cache/finlab_db
          key: finlab-db-${{ steps.day.outputs.key }}
          restore-keys: |
            finlab-db-

      # 上一次產生的 FinLab 資料（試算資料、創新高）。
      #
      # 鍵上的 v3 是**資料格式版本**：改了產出的結構就要跟著加一號，否則部署會沿用
      # 舊格式的快取，而新版前端讀不懂它。創新高從單一窗口改成三個窗口時踩過一次。
      # v2 -> v3 是因為績效曲線整個搬離 FinLab，這份快取不再包含 series 與
      # 解鎖 manifest（曲線有自己的快取，見下面「取回績效曲線快取」）。
      - name: 取回上次的 FinLab 資料
        id: datacache
        uses: actions/cache/restore@v4
        with:
          path: |
            app/public/data/calc
            app/public/data/highs.json
          key: finlab-data-v3-${{ github.run_id }}
          restore-keys: |
            finlab-data-v3-

      - name: 決定要不要重抓 FinLab
        id: plan
        run: |
          # 有可用的舊資料、又不是明確要求重抓，就沿用
          if [ -f app/public/data/calc/index.json ] && [ "$REFRESH_FINLAB" != "true" ]; then
            echo "reuse=true" >> $GITHUB_OUTPUT
            echo "沿用上次的 FinLab 資料（沒有動用今天的流量）"
          else
            echo "reuse=false" >> $GITHUB_OUTPUT
            if [ "$REFRESH_FINLAB" = "true" ]; then
              echo "這次要重抓 FinLab（每日更新或手動指定）"
            else
              echo "::warning::沒有可沿用的 FinLab 資料，這次會重抓"
            fi
          fi

      # 重抓之前先把沿用到的那份留一份備份。FinLab 掛掉或額度用完時（兩種都遇過）
      # 就退回這一份 —— 資料舊一天，但試算與圖表都還在，而且不相關的新功能照樣上線。
      - name: 備份可沿用的資料
        id: backup
        if: ${{ hashFiles('app/public/data/calc/index.json') != '' }}
        run: |
          mkdir -p .cache/prev
          cp -r app/public/data/calc .cache/prev/
          [ -f app/public/data/highs.json ] && cp app/public/data/highs.json .cache/prev/ || true
          echo "已備份可沿用的資料"

      # 試算用的月頻價格與配息。這份**不加密**：月頻收盤價與除息金額本來就是
      # 交易所與投信公開的資訊，這裡只是整理成月度摘要，不是那份按日的付費資料集。
      # 不加密，計算機才能免密碼使用。
      - name: 產生試算資料
        id: calc
        if: ${{ env.FINLAB_API_TOKEN != '' && steps.plan.outputs.reuse != 'true' }}
        continue-on-error: true
        run: python scripts/fetch_calc.py

      # 個股籌碼的累積（近 20 個交易日的三大法人買賣超）。用自己的快取，
      # 跟 FinLab 那份分開 —— 它每天都要更新，而 FinLab 那份刻意一天只動一次。
      - name: 取回個股籌碼快取
        uses: actions/cache/restore@v4
        with:
          path: .cache/stock_chips.json
          key: stock-chips-${{ github.run_id }}
          restore-keys: |
            stock-chips-

      # 快取是空的時候會自己回補 20 個交易日（T86 可以指定日期）。
      - name: 產生個股資料
        id: stocks
        continue-on-error: true
        run: python scripts/fetch_stocks.py

      - name: 存下個股籌碼快取
        if: ${{ steps.stocks.outcome == 'success' && hashFiles('.cache/stock_chips.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: .cache/stock_chips.json
          key: stock-chips-${{ github.run_id }}

      # 績效曲線的快取，跟 FinLab 那組分開。
      #
      # 為什麼要分開：FinLab 那份只在「重抓」的執行才存回去（見底下那一步），
      # 而曲線是每次部署都可能補幾檔的。共用的話，沿用快取的推送補到的東西
      # 全部留不住 —— 實際發生過：線上檔數在 293 與 273 之間跳，因為每次部署都
      # 從零重抓，每次都在 FinMind 的每小時上限那裡被擋在同一個地方，尾巴那
      # 八十幾檔永遠輪不到。
      #
      # 兩段還原：舊鍵 tw-series- 是美股還在 FinLab 時的台股專用快取，裡面有
      # 已經補好的三百多檔。cache/restore 是把封存檔解到路徑上、不會先清空，
      # 所以先還原舊的、再讓新的蓋上去是安全的，而且省掉一整輪重抓。
      # 新鍵普及之後（幾天內）這一步可以刪掉。
      - name: 取回舊的台股曲線快取（過渡用）
        uses: actions/cache/restore@v4
        with:
          path: |
            app/public/data/series/tw
            app/public/data/series/_tw.json
          key: tw-series-nonexistent
          restore-keys: |
            tw-series-

      - name: 取回績效曲線快取
        uses: actions/cache/restore@v4
        with:
          path: app/public/data/series
          key: series-${{ github.run_id }}
          restore-keys: |
            series-

      # 台股曲線：FinMind 的公開資料，不動用 FinLab，也不必加密。
      #
      # **每次部署都跑，但兩種模式。** 重抓的那種（每日更新）跑完整的一輪；
      # 沿用快取的推送只跑 --only-missing —— 通常一檔都不缺，一個請求都不發就結束。
      # 會缺是因為 FinMind 免費層每小時 300 次，一次執行不一定跑得完三百多檔
      # （第一次上線就在第 293 檔被擋，尾巴那 60 檔整批沒有曲線）。
      # 用 FinMind 不花 FinLab 額度，所以這樣補很便宜。
      - name: 產生台股績效曲線（FinMind）
        id: twseries
        continue-on-error: true
        env:
          # 免費註冊就有，把 FinMind 的每小時額度從 300 拉到 600 次。沒設定也能跑，
          # 只是一次跑不完三百多檔，會分兩次補齊。
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: |
          if [ "${{ steps.plan.outputs.reuse }}" = "true" ]; then
            python scripts/fetch_series_tw.py --only-missing
          else
            # 單輪上限：台股 359 檔加美股 712 檔，遠多於一小時的額度。先跑的那個
            # 不設限就會把額度吃光，後面那個永遠輪不到 —— 所以兩邊各分一半。
            # 輪替會讓每一輪都先服務「沒有曲線的」與「資料最舊的」，所以分批不會
            # 有標的被餓死，只是尾巴的曲線可能晚一兩天更新。
            python scripts/fetch_series_tw.py --limit=$FINMIND_BUDGET
          fi
          # 快取裡殘留的舊加密檔：現在是公開資料，不該再有加密版本佔空間
          rm -f app/public/data/series/tw/*.json.enc app/public/data/series/_tw.json.enc

      # 美股曲線：同樣是 FinMind，同一個額度池，同樣兩種模式。
      #
      # 它的 Adj_Close 是**含息還原**的，所以這一步同時修掉了另一個問題：
      # FinLab 的 us_fund_price 只還原分割，QYLD 那種高配息標的的曲線因此長期
      # 在誤導人（近七年含息 +117%、純價格 -13%）。
      #
      # 712 檔（只畫有流動性的）比台股多一倍，所以沒有 token 時要分幾輪補。
      - name: 產生美股績效曲線（FinMind）
        id: usseries
        continue-on-error: true
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: |
          if [ "${{ steps.plan.outputs.reuse }}" = "true" ]; then
            python scripts/fetch_series_us.py --only-missing
          else
            python scripts/fetch_series_us.py --limit=$FINMIND_BUDGET
          fi
          # 加密時代留下來的檔案：美股曲線現在也是公開資料
          rm -f app/public/data/series/us/*.json.enc app/public/data/series/_us.json.enc

      # 補到的就要留住。條件只看「有沒有東西」，不看這次是重抓還是沿用 ——
      # 沿用的那種正是會一點一點把缺口補起來的。
      - name: 存下績效曲線快取
        if: ${{ hashFiles('app/public/data/series/_tw.json') != ''
                || hashFiles('app/public/data/series/_us.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: app/public/data/series
          key: series-${{ github.run_id }}

      # 創 200 日新高。放在試算資料之後：它用的 etl:adj_close 與 price:收盤價 就是
      # 上一步抓過的那兩份，同一次執行共用 .cache/finlab_db，所以不會再下載一次。
      - name: 產生創新高資料
        id: highs
        if: ${{ env.FINLAB_API_TOKEN != '' && steps.plan.outputs.reuse != 'true' }}
        continue-on-error: true
        run: python scripts/fetch_highs.py

      # 新聞與重大訊息。同樣不需要 FinLab，也同樣容許失敗：媒體或觀測站掛掉時
      # 新聞頁自己會說「還沒有資料」，不該連帶讓整個網站不能部署。
      - name: 產生新聞資料
        continue-on-error: true
        run: python scripts/fetch_news.py

      # 即將上市的 ETF（證交所 e添富的新上市簡介）。一個列表加十幾頁簡介；
      # 缺檔時台股頁的「即將上市」分頁會說還沒有資料，不影響其他東西。
      - name: 產生即將上市 ETF 資料
        continue-on-error: true
        run: python scripts/fetch_upcoming.py

      # 籌碼面（期交所三大法人／大額交易人、交易所法人買賣超）。不需要 FinLab，
      # 來源都是公開端點。continue-on-error 是刻意的：交易所偶爾維護或逾時，
      # 那不該讓整個網站的部署失敗 —— 缺檔時籌碼頁自己會說「今天還沒有資料」。
      - name: 產生籌碼資料
        continue-on-error: true
        env:
          # 融資餘額、VIX 與自算恐懼貪婪用的美股序列來自 FinMind（七個請求）
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python scripts/fetch_chips.py

      # FinLab 失敗（額度用完、服務中斷、或改版）時退回備份。半途失敗的產出不能
      # 只補一半 —— 那會混出一份新舊相間的資料，所以整組換回去。
      #
      # **績效曲線不在這組裡了**：兩個市場都改用 FinMind，跟 FinLab 的成敗無關，
      # 而且它們有自己的快取與補抓機制。FinLab 現在只剩試算資料與創新高。
      - name: 重抓失敗時退回上一份資料
        # 只看試算資料：創新高失敗只是少一頁的資料，把整組退回反而讓試算一起變舊，
        # 代價大於好處。
        if: ${{ steps.calc.outcome == 'failure' }}
        run: |
          rm -rf app/public/data/calc app/public/data/highs.json
          if [ -d .cache/prev/calc ]; then
            cp -r .cache/prev/calc app/public/data/
            [ -f .cache/prev/highs.json ] && cp .cache/prev/highs.json app/public/data/ || true
            echo "::warning title=FinLab 抓取失敗::已退回快取裡的上一份資料，日期會比今天舊。常見原因是每日流量用完。"
          elif python scripts/reuse_calc.py; then
            # 快取被淘汰、或這個機制剛啟用還沒有快取。直接抓線上那份試算資料。
            echo "::warning title=FinLab 抓取失敗::已改用線上那份試算資料。"
          else
            echo "::error title=FinLab 抓取失敗::而且沒有任何可退回的資料，這次不部署（線上維持前一版）。"
            exit 1
          fi

      # continue-on-error 會把失敗的步驟記成 conclusion=success，在 Actions 的畫面上
      # 看不出哪裡少了東西（籌碼第一次上線就是這樣靜靜地缺掉）。這一步把結果講清楚。
      - name: 檢查選配資料是否齊備
        if: ${{ always() }}
        run: |
          for f in chips news; do
            path="app/public/data/$f.json"
            if [ -f "$path" ]; then
              echo "$f.json 已產生（$(wc -c < "$path") bytes）"
              # meta.errors 是資料自己記下的缺漏（某個來源拒絕連線之類）
              python -c "import io,json,sys;d=json.load(io.open(sys.argv[1],encoding='utf-8'));[print('::warning title=%s 有缺漏::%s'%(sys.argv[2],e)) for e in (d.get('meta') or {}).get('errors') or []]" "$path" "$f"
            else
              echo "::warning title=$f.json 沒有產生::這次部署不含這一頁的資料，頁面會顯示「還沒有資料」。"
            fi
          done
          for m in tw us; do
            n=$(ls app/public/data/series/$m/*.json 2>/dev/null | wc -l)
            if [ "$n" -gt 0 ]; then
              echo "${m} 績效曲線 $n 檔（FinMind，免密碼）"
            else
              echo "::warning title=${m} 績效曲線沒有產生::收藏頁的績效比較會缺這個市場。"
            fi
          done
          if [ -f app/public/data/stocks/index.json ]; then
            echo "個股 $(python -c "import io,json;print(json.load(io.open('app/public/data/stocks/index.json',encoding='utf-8'))['meta']['stocks'])") 檔"
          else
            echo "::warning title=個股資料沒有產生::個股頁會顯示「還沒有資料」。"
          fi

      # 這裡本來有「加密受保護的資料」與「確認價格序列沒有以明文上線」兩步。
      # 兩個市場的曲線都改用 FinMind 之後，上線的資料裡已經沒有 FinLab 的付費
      # 內容了（試算資料一直是公開資訊整理成的月度摘要），所以沒有東西要加密，
      # 也沒有東西要檢查。`scripts/encrypt_data.py` 與前端的解鎖畫面都還留著，
      # 哪天又有付費資料要上線時照 CLAUDE.md 的清單接回去。
      - name: 沒有 FinLab 憑證時的提醒
        if: ${{ env.FINLAB_API_TOKEN == '' && steps.plan.outputs.reuse != 'true' }}
        run: |
          echo "::warning::沒有 FINLAB_API_TOKEN secret，這次部署不含績效曲線與試算資料。"
          echo "::warning::台股與美股清單不受影響（兩份都在版控中）。"

      # 存進快取給後續的程式碼推送用。
      - name: 存下這次的 FinLab 資料
        if: ${{ steps.plan.outputs.reuse != 'true'
                && steps.calc.outcome != 'failure'
                && hashFiles('app/public/data/calc/index.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: |
            app/public/data/calc
            app/public/data/highs.json
          key: finlab-data-v3-${{ github.run_id }}

      - name: 驗證資料
        run: |
          python scripts/verify_data.py app/public/data/etfs.json
          python scripts/verify_us_data.py app/public/data/us_etfs.json

      - name: 測試
        working-directory: app
        run: npm test

      - name: 建置
        working-directory: app
        run: npm run build

      - name: 保留舊版單頁（既有連結不要壞掉）
        # 轉換期間兩個前端並存：新站是根目錄，舊的單檔版留在原網址。
        # 等新版穩定一段時間後可以拿掉這一步。
        run: cp taiwan_etf_list.html app/dist/taiwan_etf_list.html

      - uses: actions/configure-pages@v5
        with:
          # 只在 Pages 尚未啟用時才會建立站台；它「不會」改變已啟用站台的來源設定。
          # 來源必須是 Settings → Pages → Source = GitHub Actions，否則內建的
          # 分支建置會同時執行，而且因為晚幾秒完成而覆蓋掉這裡的產物。
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
