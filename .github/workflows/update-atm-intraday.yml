# 盤中價平和（每 15 分鐘）：期交所選擇權逐筆成交 → app/public/data/atm_intraday/
#
# 獨立於 update-data.yml：期交所逐筆檔大約 16:45 才公布，而且只保留前 30 個交易日，
# 晚一點跑、失敗了隔天還補得回來；跟每日更新綁在一起的話，一邊失敗會拖累另一邊。
# 每天只新增一個約 8 KB 的日檔（不重寫舊檔），Git 歷史不會膨脹。
#
# 台灣 18:40 = UTC 10:40（週一到週五）。
name: 盤中價平和

on:
  schedule:
    - cron: '40 10 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-atm-intraday
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 抓逐筆並計算（補齊期交所還提供的日子）
        run: python scripts/fetch_atm_intraday.py

      - name: 提交
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add app/public/data/atm_intraday/
          if git diff --cached --quiet; then
            echo "沒有新的交易日"
            echo "changed=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          N=$(git diff --cached --name-only | grep -c '/[0-9-]*\.json$' || true)
          git commit -m "資料：盤中價平和（新增 ${N} 個交易日）"
          # 每日更新流程可能同時在推，先接上遠端最新版再推
          for i in 1 2 3; do
            git pull --rebase --quiet origin "${GITHUB_REF_NAME}" && git push && break
            [ "$i" = 3 ] && exit 1
            sleep 10
          done
          echo "changed=true" >> $GITHUB_OUTPUT

  # GITHUB_TOKEN 推的 commit 不會觸發 push 事件，所以主動呼叫部署
  deploy:
    needs: update
    if: ${{ needs.update.outputs.changed == 'true' }}
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
    permissions:
      contents: read
      pages: write
      id-token: write
